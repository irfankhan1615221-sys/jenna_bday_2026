
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy 26th Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bg-music" autoplay loop>
        <source src="InDaClub.mp3" type="audio/mpeg">
    </audio>

    <header>
        <h1>Happy 26th Birthday!</h1>
        <p class="blurb">On February 26th, 2026, you turn 26 — your champagne birthday! A once‑in‑a‑lifetime sparkle moment, and I wanted to celebrate it with something special, fun, and totally you.</p>
    </header>

    <section class="hero">
        <img src="images/edit_the_uploaded_im.png" alt="Main drawing">
    </section>

    <h2 class="gallery-title">A Gallery of You</h2>

    <section class="gallery">
        <img class="gallery-img" src="images/image1.jpeg" alt="Drawing"><img class="gallery-img" src="images/image2.jpeg" alt="Drawing"><img class="gallery-img" src="images/image3.jpeg" alt="Drawing"><img class="gallery-img" src="images/image4.jpeg" alt="Drawing">
    </section>

    <div id="modal" class="modal">
        <span id="close">&times;</span>
        <canvas id="confetti-canvas"></canvas>
        <img id="modal-img">
    </div>

    <footer>
        <p>Made with love ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
